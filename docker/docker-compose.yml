# Container names and host ports are derived from the compose project name rather than
# hardcoded, so a second checkout (e.g. a git worktree for a parallel hotfix) can run its
# own stack alongside this one. See README.md in this directory.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "ds"
      MYSQL_DATABASE: "ds"
    ports:
      - "${DS_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Drop a .sql or .sql.gz dump in here before first `docker compose up` to
      # have it auto-loaded (only runs against a fresh/empty data volume).
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pds"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Brings whatever schema is in `db` (freshly created, or from a loaded dump)
  # up to what the current code expects. Runs once per `up` and exits.
  flyway:
    image: flyway/flyway:9.0.0
    depends_on:
      db:
        condition: service_healthy
    command:
      - -url=jdbc:mysql://db:3306/ds?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=ds
      - -connectRetries=30
      - migrate
    volumes:
      - ../game/src/main/resources/db/migration:/flyway/sql:ro

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "${DS_APP_PORT:-8080}:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/ds?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: "root"
      DB_PASSWORD: "ds"

volumes:
  db-data:
